name: "Update"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '5 1 * * *'
  workflow_dispatch:

jobs:
  spec_update:
    name: "Update spec files"
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest tarball
        run: curl -sLO https://src.fedoraproject.org/lookaside/rpm-specs-latest.tar.xz
        
      - name: Extract tarball
        run: tar xf rpm-specs-latest.tar.xz
        
      - name: Store updated specs
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: main
          FOLDER: rpm-specs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQUASH_HISTORY: false
          TARGET_DIR: specs

  update_filelist:
    name: "Update file list for GitHub Pages"
    needs: spec_update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate filelist.json
        run: ls specs/ | sort | jq -R -s 'split("\n") | map(select(. != ""))' > filelist.json

      - name: Commit and push filelist.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filelist.json
          git diff --staged --quiet && echo "No changes to filelist" || (git commit -m "Update filelist.json [skip ci]" && git push)
